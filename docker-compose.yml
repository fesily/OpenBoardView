# OpenBoardView web server (obv_server + SPA)
#
# Usage:
#   mkdir -p boards data
#   # put .bvr files in ./boards (must be readable inside container)
#   docker compose up --build
#
# If PARSE_FAILED "Not a regular file" / permission errors:
#   - Image runs as root by default so host bind mounts are readable.
#   - If you set user: in compose, chown boards to that UID or chmod -R a+rX boards
#
# Health: curl -fsS http://127.0.0.1:8080/api/v1/health

services:
  obv-server:
    # --- build locally ---
    build:
      context: .
      dockerfile: Dockerfile.server
    image: obv-server:local
    # --- or use GHCR instead of build: ---
    # image: ghcr.io/fesily/openboardview/obv-server:web-support
    # image: ghcr.io/fesily/openboardview/obv-server:latest

    container_name: obv-server
    restart: unless-stopped

    ports:
      - "8080:8080"
    # Bind localhost only (optional):
    # ports:
    #   - "127.0.0.1:8080:8080"

    # Optional CLI override (defaults match Dockerfile ENTRYPOINT/CMD):
    # command:
    #   - --host
    #   - 0.0.0.0
    #   - --port
    #   - "8080"
    #   - --boards

    #   - /app/boards
    #   - --www
    #   - /app/www

    environment:
      # Documented for operators; binary uses CLI flags from CMD by default.
      OBV_HOST: "0.0.0.0"
      OBV_PORT: "8080"
      OBV_BOARDS: /app/boards

      OBV_WWW: /app/www

    volumes:
      # Board library (host path must exist and contain board files)
      - ./boards:/app/boards:ro
      # Overlays and chip library persist alongside boards under /app/boards (needs write)
      # Optional decrypt keys:
      # - ./boards/config/keys.json:/app/boards/config/keys.json:ro
